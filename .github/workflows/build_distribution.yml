name: Build distribution
run-name: Build distribution ${{ github.ref_name }} @ ${{ github.sha }}

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - "**"

permissions:
  contents: read

concurrency:
  group: oculum-distribution-${{ github.ref }}
  # A second push must queue behind a distribution build. Flutter's Windows
  # toolchain runs through cmd.exe; cancelling that run can surface as
  # "Terminate batch job (Y/N)?" and makes Package Windows release skip.
  cancel-in-progress: false

jobs:
  validate:
    name: Analyze and test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Verify public downloads and isolated Windows updater
        shell: pwsh
        run: |
          python -m unittest discover -s scripts/tests -p test_publish_github_downloads.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s scripts/tests -p test_windows_update.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: flutter analyze --no-pub
      - name: Verify manual build and publication command
        shell: pwsh
        run: ./scripts/tests/test_publish_oculum_github.ps1
      # Keep image-heavy widget suites within the Windows runner's memory budget.
      - run: flutter test --no-pub --concurrency=2
      - name: Verify authenticated online transport and combat
        if: github.event_name != 'pull_request'
        timeout-minutes: 10
        run: flutter test --no-pub --concurrency=1 --dart-define=OculumLiveRealtimeTest=true --dart-define=OculumLiveSupabaseTest=true test/oculum_supabase_live_connection_test.dart test/oculum_cloud_live_isolation_test.dart test/oculum_realtime_live_delivery_test.dart test/oculum_combat_live_application_test.dart
      - name: Verify diary link suggestions
        run: flutter test --no-pub test/oculum_diary_memory_test.dart
      - name: Verify diary typing latency regression
        run: flutter test --no-pub test/oculum_diary_typing_test.dart
      - name: Publish added monster equipment and skill verification
        uses: actions/upload-artifact@v6
        with:
          name: Oculum-Verifica-Mostri
          path: |
            build/added-monsters-completeness.json
            build/added-monster-skill-runtime.json
          if-no-files-found: error
          retention-days: 30
      - name: Publish fresh desktop and phone captures
        uses: actions/upload-artifact@v6
        with:
          name: Oculum-UI-Catture
          path: |
            output/ui/resistances-turns-20261003/*.png
            output/ui/temi-goth/*.png
            build/theme-identity-gallery.png
          if-no-files-found: error
          retention-days: 30

  # â”€â”€ Windows â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  build-windows:
    needs: validate
    name: Build Windows ${{ matrix.edition }}
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: normal
            save_profile: ''
            artifact: Oculum-Windows
          - edition: test
            save_profile: test
            artifact: Oculum-Test-Windows

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Create Windows platform if missing
        shell: pwsh
        run: |
          if (!(Test-Path "windows")) {
            flutter create --platforms=windows .
          }

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release
        shell: pwsh
        timeout-minutes: 45
        env:
          OCULUM_SUPABASE_URL: ${{ secrets.OCULUM_SUPABASE_URL }}
          OCULUM_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.OCULUM_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          flutter build windows --release `
            "--dart-define=OculumSourceCommit=${{ github.sha }}" `
            "--dart-define=OculumSaveProfile=${{ matrix.save_profile }}" `
            "--dart-define=OculumSupabaseUrl=$env:OCULUM_SUPABASE_URL" `
            "--dart-define=OculumSupabasePublishableKey=$env:OCULUM_SUPABASE_PUBLISHABLE_KEY"

          if (!(Test-Path "build/windows/x64/runner/Release")) {
            throw "Flutter Windows build completed without build/windows/x64/runner/Release."
          }

      - name: Package Windows release
        shell: pwsh
        run: |
          $dist = if ('${{ matrix.edition }}' -eq 'test') { "build/distribution/test/windows" } else { "build/distribution/windows" }
          New-Item -ItemType Directory -Force -Path $dist
          Copy-Item -Recurse -Force "build/windows/x64/runner/Release/*" $dist
          if ('${{ matrix.edition }}' -eq 'test') {
            Rename-Item -LiteralPath "$dist/oculum.exe" -NewName 'Oculum-Test.exe'
          }
          if ('${{ matrix.edition }}' -eq 'normal' -and (Get-ChildItem -LiteralPath $dist -Recurse | Where-Object { $_.Name -match '(?i)oculum-test|windows[ -]test|windows-test' })) {
            throw 'Windows normal must not contain Windows Test.'
          }
          Compress-Archive -Path "$dist/*" -DestinationPath "build/distribution/${{ matrix.artifact }}.zip" -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: build/distribution/${{ matrix.artifact }}.zip
          if-no-files-found: error
          retention-days: 30

  # â”€â”€ macOS (unsigned) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  package-windows-folders:
    needs: build-windows
    name: Package Windows folders
    runs-on: windows-latest
    steps:
      - name: Download normal Windows package
        uses: actions/download-artifact@v7
        with:
          name: Oculum-Windows
          path: build/downloads/windows

      - name: Download Windows Test package
        uses: actions/download-artifact@v7
        with:
          name: Oculum-Test-Windows
          path: build/downloads/windows-test

      - name: Restore unpacked Windows folders
        shell: pwsh
        run: |
          $normalArchive = 'build/downloads/windows/Oculum-Windows.zip'
          $testArchive = 'build/downloads/windows-test/Oculum-Test-Windows.zip'
          if (!(Test-Path -LiteralPath $normalArchive -PathType Leaf)) {
            throw 'The normal Windows ZIP is missing from its successful build artifact.'
          }
          if (!(Test-Path -LiteralPath $testArchive -PathType Leaf)) {
            throw 'The Windows Test ZIP is missing from its successful build artifact.'
          }
          $normalRoot = 'build/distribution/windows-folders/Windows'
          $testRoot = 'build/distribution/windows-folders/Windows Test'
          New-Item -ItemType Directory -Force -Path $normalRoot, $testRoot | Out-Null
          Expand-Archive -LiteralPath $normalArchive -DestinationPath $normalRoot -Force
          Expand-Archive -LiteralPath $testArchive -DestinationPath $testRoot -Force
          foreach ($required in @(
            "$normalRoot/oculum.exe",
            "$normalRoot/flutter_windows.dll",
            "$normalRoot/data/app.so",
            "$testRoot/Oculum-Test.exe",
            "$testRoot/flutter_windows.dll",
            "$testRoot/data/app.so"
          )) {
            if (!(Test-Path -LiteralPath $required -PathType Leaf)) {
              throw "Unpacked Windows artifact is missing: $required"
            }
          }

      - name: Upload unpacked normal Windows folder
        uses: actions/upload-artifact@v6
        with:
          name: Oculum-Windows-Folder
          path: build/distribution/windows-folders/Windows/
          if-no-files-found: error
          retention-days: 30

      - name: Upload unpacked Windows Test folder
        uses: actions/upload-artifact@v6
        with:
          name: Oculum-Test-Windows-Folder
          path: build/distribution/windows-folders/Windows Test/
          if-no-files-found: error
          retention-days: 30

  build-macos:
    needs: validate
    name: Build macOS
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Create macOS platform if missing
        run: |
          if [ ! -d "macos" ]; then
            flutter create --platforms=macos .
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS release
        shell: bash
        env:
          OCULUM_SUPABASE_URL: ${{ secrets.OCULUM_SUPABASE_URL }}
          OCULUM_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.OCULUM_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          flutter build macos --release \
            "--dart-define=OculumSourceCommit=${{ github.sha }}" \
            "--dart-define=OculumSupabaseUrl=${OCULUM_SUPABASE_URL}" \
            "--dart-define=OculumSupabasePublishableKey=${OCULUM_SUPABASE_PUBLISHABLE_KEY}" \
            "--dart-define=OculumOAuthRedirectUrl=com.mich.oculum://login-callback"

      - name: Package macOS release
        shell: bash
        env:
          APPLE_DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          APP_PATH=$(find build/macos/Build/Products/Release -maxdepth 1 -type d -name "*.app" -print -quit)
          if [ -z "$APP_PATH" ]; then
            echo "No .app bundle found"
            exit 1
          fi
          mkdir -p build/distribution
          bash scripts/sign_and_notarize_macos.sh "$APP_PATH" build/distribution/Oculum-macOS.zip

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v6
        with:
          name: Oculum-macOS
          path: build/distribution/Oculum-macOS.zip
          if-no-files-found: error
          retention-days: 30

  # â”€â”€ iOS (unsigned) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  build-ios-unsigned:
    needs: validate
    name: Build iOS unsigned
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create iOS platform if missing
        run: |
          if [ ! -d "ios" ]; then
            flutter create --platforms=ios .
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS release without codesign
        shell: bash
        env:
          OCULUM_SUPABASE_URL: ${{ secrets.OCULUM_SUPABASE_URL }}
          OCULUM_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.OCULUM_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          flutter build ios --release --no-codesign \
            "--dart-define=OculumSourceCommit=${{ github.sha }}" \
            "--dart-define=OculumSupabaseUrl=${OCULUM_SUPABASE_URL}" \
            "--dart-define=OculumSupabasePublishableKey=${OCULUM_SUPABASE_PUBLISHABLE_KEY}"

      - name: Package iOS unsigned IPA
        run: |
          if [ ! -d "build/ios/iphoneos/Runner.app" ]; then
            echo "Runner.app missing"
            exit 1
          fi
          mkdir -p build/distribution/ios/Payload
          cp -R build/ios/iphoneos/Runner.app build/distribution/ios/Payload/
          cd build/distribution/ios
          zip -qry ../Oculum-iOS-unsigned.ipa Payload

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v6
        with:
          name: Oculum-iOS-unsigned
          path: build/distribution/Oculum-iOS-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

  # â”€â”€ Linux â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  build-linux:
    needs: validate
    name: Build Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            libsecret-1-dev \
            xvfb

      - name: Setup Java for native package hooks
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Create Linux platform if missing
        run: |
          if [ ! -d "linux" ]; then
            flutter create --platforms=linux .
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze
        continue-on-error: true

      - name: Build Linux release
        shell: bash
        env:
          OCULUM_SUPABASE_URL: ${{ secrets.OCULUM_SUPABASE_URL }}
          OCULUM_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.OCULUM_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          flutter build linux --release \
            "--dart-define=OculumSourceCommit=${{ github.sha }}" \
            "--dart-define=OculumSupabaseUrl=${OCULUM_SUPABASE_URL}" \
            "--dart-define=OculumSupabasePublishableKey=${OCULUM_SUPABASE_PUBLISHABLE_KEY}"

      - name: Smoke-test Linux startup
        shell: bash
        run: |
          set +e
          timeout 20s xvfb-run -a \
            build/linux/x64/release/bundle/oculum \
            > build/linux-startup.log 2>&1
          status=$?
          set -e
          cat build/linux-startup.log
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            echo "Oculum exited unexpectedly during the Linux startup test."
            exit "$status"
          fi

      - name: Package Linux release
        run: bash scripts/package_linux_release.sh

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v6
        with:
          name: Oculum-Linux
          path: build/distribution/Oculum-Linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 30

  # â”€â”€ Android â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  build-android:
    needs: validate
    name: Build Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Restore stable Android signing identity
        shell: bash
        env:
          OCULUM_ANDROID_KEYSTORE_BASE64: ${{ secrets.OCULUM_ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$OCULUM_ANDROID_KEYSTORE_BASE64" || { echo "Missing stable Android signing secret"; exit 1; }
          mkdir -p "$HOME/.android"
          printf '%s' "$OCULUM_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"

      - name: Build Android release APK
        shell: bash
        env:
          OCULUM_SUPABASE_URL: ${{ secrets.OCULUM_SUPABASE_URL }}
          OCULUM_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.OCULUM_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          flutter build apk --release \
            "--dart-define=OculumSourceCommit=${{ github.sha }}" \
            "--dart-define=OculumSupabaseUrl=${OCULUM_SUPABASE_URL}" \
            "--dart-define=OculumSupabasePublishableKey=${OCULUM_SUPABASE_PUBLISHABLE_KEY}"

      - name: Package Android release
        run: |
          mkdir -p build/distribution/android
          cp build/app/outputs/flutter-apk/app-release.apk build/distribution/Oculum-Android-release.apk

      - name: Build Android App Bundle
        env:
          OCULUM_SUPABASE_URL: ${{ secrets.OCULUM_SUPABASE_URL }}
          OCULUM_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.OCULUM_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          flutter build appbundle --release \
            "--dart-define=OculumSourceCommit=${{ github.sha }}" \
            "--dart-define=OculumSupabaseUrl=${OCULUM_SUPABASE_URL}" \
            "--dart-define=OculumSupabasePublishableKey=${OCULUM_SUPABASE_PUBLISHABLE_KEY}"

      - name: Package Android App Bundle
        run: cp build/app/outputs/bundle/release/app-release.aab build/distribution/Oculum-Android-release.aab

      - name: Upload Android artifact
        uses: actions/upload-artifact@v6
        with:
          name: Oculum-Android
          path: |
            build/distribution/Oculum-Android-release.apk
            build/distribution/Oculum-Android-release.aab
          if-no-files-found: error
          retention-days: 30

  build-web:
    needs: validate
    name: Build Web archive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Verify browser save storage
        timeout-minutes: 5
        run: flutter test --no-pub --platform chrome test/oculum_web_save_store_test.dart
      - name: Build Web release
        env:
          OCULUM_SUPABASE_URL: ${{ secrets.OCULUM_SUPABASE_URL }}
          OCULUM_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.OCULUM_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          flutter build web --release --base-href / \
            "--dart-define=OculumSourceCommit=${{ github.sha }}" \
            "--dart-define=OculumSupabaseUrl=${OCULUM_SUPABASE_URL}" \
            "--dart-define=OculumSupabasePublishableKey=${OCULUM_SUPABASE_PUBLISHABLE_KEY}"
      - name: Package Web release
        run: |
          python3 -c "from pathlib import Path; import os; [p.write_text(p.read_text().replace('__OCULUM_BUILD__', os.environ['GITHUB_SHA'])) for p in [Path('build/web/index.html'), Path('build/web/flutter_bootstrap.js')]]"
          mkdir -p build/distribution
          cd build/web
          zip -qry ../distribution/Oculum-Web.zip .
      - uses: actions/upload-artifact@v6
        with:
          name: Oculum-Web
          path: build/distribution/Oculum-Web.zip
          if-no-files-found: error
          retention-days: 30
