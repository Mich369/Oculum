name: Crea e aggiorna macOS
run-name: macOS ${{ github.ref_name }} @ ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Aggiorna anche l asset della release macOS latest
        required: true
        default: true
        type: boolean
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: oculum-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    name: Verifica e crea Oculum macOS
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout del commit richiesto
        uses: actions/checkout@v6

      - name: Configura Flutter stabile
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Diagnostica toolchain Apple
        run: |
          flutter --version
          flutter doctor -v
          xcodebuild -version
          sw_vers

      - name: Verifica dipendenza compatibile macOS
        run: |
          test -f pubspec_overrides.yaml
          grep -q "connectivity_plus: 6.1.5" pubspec_overrides.yaml

      - name: Prepara progetto macOS e dipendenze
        run: |
          flutter config --enable-macos-desktop
          if [ ! -d macos ]; then
            flutter create --platforms=macos .
          fi
          flutter pub get

      - name: Analisi statica
        run: flutter analyze

      - name: Verifica connessione Supabase da macOS
        shell: bash
        env:
          OCULUM_SUPABASE_URL: ${{ secrets.OCULUM_SUPABASE_URL }}
          OCULUM_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.OCULUM_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          flutter test test/oculum_supabase_live_connection_test.dart \
            "--dart-define=OculumLiveSupabaseTest=true" \
            "--dart-define=OculumSupabaseUrl=${OCULUM_SUPABASE_URL}" \
            "--dart-define=OculumSupabasePublishableKey=${OCULUM_SUPABASE_PUBLISHABLE_KEY}"

      - name: Test Flutter
        run: flutter test

      - name: Build macOS release
        shell: bash
        env:
          OCULUM_SUPABASE_URL: ${{ secrets.OCULUM_SUPABASE_URL }}
          OCULUM_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.OCULUM_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          flutter build macos --release \
            "--dart-define=OculumSupabaseUrl=${OCULUM_SUPABASE_URL}" \
            "--dart-define=OculumSupabasePublishableKey=${OCULUM_SUPABASE_PUBLISHABLE_KEY}" \
            "--dart-define=OculumOAuthRedirectUrl=com.mich.oculum://login-callback"

      - name: Valida e impacchetta applicazione
        id: package
        shell: bash
        env:
          APPLE_DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          APP_PATH=$(find build/macos/Build/Products/Release -maxdepth 1 -type d -name "*.app" -print -quit)
          if [ -z "$APP_PATH" ]; then
            echo "Nessun bundle .app trovato nella cartella Release"
            exit 1
          fi

          INFO_PLIST="$APP_PATH/Contents/Info.plist"
          plutil -lint "$INFO_PLIST"
          EXECUTABLE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$INFO_PLIST")
          test -n "$EXECUTABLE"
          test -x "$APP_PATH/Contents/MacOS/$EXECUTABLE"

          mkdir -p build/distribution
          bash scripts/sign_and_notarize_macos.sh "$APP_PATH" build/distribution/Oculum-macOS.zip
          shasum -a 256 build/distribution/Oculum-macOS.zip > build/distribution/Oculum-macOS.sha256

          APP_NAME=$(basename "$APP_PATH")
          echo "app_name=$APP_NAME" >> "$GITHUB_OUTPUT"
          echo "### Oculum macOS" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Bundle: \`$APP_NAME\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Eseguibile verificato: \`$EXECUTABLE\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA-256: \`$(cut -d ' ' -f 1 build/distribution/Oculum-macOS.sha256)\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Carica artefatto macOS aggiornato
        uses: actions/upload-artifact@v6
        with:
          name: Oculum-macOS
          path: |
            build/distribution/Oculum-macOS.zip
            build/distribution/Oculum-macOS.sha256
          if-no-files-found: error
          retention-days: 1

      - name: Aggiorna release macOS latest
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Build macOS aggiornata dal commit $GITHUB_SHA. Bundle verificato: ${{ steps.package.outputs.app_name }}."
          if gh release view oculum-macos-latest >/dev/null 2>&1; then
            gh release upload oculum-macos-latest \
              build/distribution/Oculum-macOS.zip \
              build/distribution/Oculum-macOS.sha256 \
              --clobber
            gh release edit oculum-macos-latest \
              --title "Oculum macOS - latest" \
              --notes "$NOTES" \
              --prerelease
          else
            gh release create oculum-macos-latest \
              build/distribution/Oculum-macOS.zip \
              build/distribution/Oculum-macOS.sha256 \
              --target "$GITHUB_SHA" \
              --title "Oculum macOS - latest" \
              --notes "$NOTES" \
              --prerelease
          fi
