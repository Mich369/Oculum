name: Build macOS App

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable macOS
        run: flutter config --enable-macos-desktop

      - name: Show project files
        run: |
          pwd
          ls -la
          echo "========== ASSETS =========="
          find assets -type d || true
          echo "========== PUBSPEC =========="
          cat pubspec.yaml

      - name: Get packages
        run: flutter pub get

      - name: Build macOS
        run: flutter build macos --release

      - name: Zip App
        run: |
          cd build/macos/Build/Products/Release
          APP=$(ls *.app)
          ditto -c -k --sequesterRsrc --keepParent "$APP" Oculum-macOS.zip

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Oculum-macOS
          path: build/macos/Build/Products/Release/Oculum-macOS.zip
