name: Diagnose Android bundle signing
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OCULUM_ANDROID_STORE_PASSWORD: ${{ secrets.OCULUM_ANDROID_STORE_PASSWORD || 'android' }}
      OCULUM_ANDROID_KEY_PASSWORD: ${{ secrets.OCULUM_ANDROID_KEY_PASSWORD || 'android' }}
      OCULUM_ANDROID_KEY_ALIAS: ${{ secrets.OCULUM_ANDROID_KEY_ALIAS || 'androiddebugkey' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: bc4811b71b9b15ac9a74b507ac03d934a1b53b9d
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Restore existing signing identity without changing it
        env:
          OCULUM_ANDROID_KEYSTORE_BASE64: ${{ secrets.OCULUM_ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$OCULUM_ANDROID_KEYSTORE_BASE64"
          umask 077
          printf '%s' "$OCULUM_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/oculum-release.keystore"
          echo "OCULUM_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/oculum-release.keystore" >> "$GITHUB_ENV"
      - name: Reproduce the original APK then bundle sequence
        env:
          OCULUM_SUPABASE_URL: ${{ secrets.OCULUM_SUPABASE_URL }}
          OCULUM_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.OCULUM_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          flutter --version
          df -h .
          free -m
          flutter build apk --release --build-number=100270 \
            --dart-define=OculumSourceCommit=bc4811b71b9b15ac9a74b507ac03d934a1b53b9d \
            "--dart-define=OculumSupabaseUrl=$OCULUM_SUPABASE_URL" \
            "--dart-define=OculumSupabasePublishableKey=$OCULUM_SUPABASE_PUBLISHABLE_KEY"
          python3 scripts/verify_android_signing.py --apk build/app/outputs/flutter-apk/app-release.apk --min-version-code 100270
          df -h .
          free -m
          set +e
          flutter build appbundle --release --build-number=100270 \
            --dart-define=OculumSourceCommit=bc4811b71b9b15ac9a74b507ac03d934a1b53b9d \
            "--dart-define=OculumSupabaseUrl=$OCULUM_SUPABASE_URL" \
            "--dart-define=OculumSupabasePublishableKey=$OCULUM_SUPABASE_PUBLISHABLE_KEY"
          bundle_status=$?
          set -e
          df -h .
          free -m
          if [ "$bundle_status" -ne 0 ]; then
            cd android
            ./gradlew :app:signReleaseBundle --stacktrace --console=plain || true
          else
            jarsigner -verify build/app/outputs/bundle/release/app-release.aab
          fi
          exit "$bundle_status"
