name: Oculum RL standalone

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'oculum_rl/**'
      - 'supabase/migrations/*oculum_lite*'
      - '.github/workflows/oculum_rl.yml'

permissions:
  contents: read

concurrency:
  group: oculum-rl-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standalone:
    runs-on: windows-latest
    name: Standalone ${{ matrix.target }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [Windows, Android, Web]
    defaults:
      run:
        shell: pwsh
        working-directory: oculum_rl
    steps:
      - uses: actions/checkout@v6
      - name: Keep Pub dependencies on the checkout drive
        run: |
          $pubCache = Join-Path $env:GITHUB_WORKSPACE '.ci-pub-cache'
          "PUB_CACHE=$pubCache" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.1'
          cache: true
      - uses: actions/setup-java@v4
        if: matrix.target == 'Android'
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Check code
        if: matrix.target == 'Windows'
        run: flutter analyze --no-pub --no-fatal-infos
      - name: Test game rules and saves
        if: matrix.target == 'Windows'
        run: flutter test --no-pub --reporter expanded
      - name: Play two complete seeded campaigns
        if: matrix.target == 'Windows'
        run: dart tool/verify_campaign.dart
      - name: Build and verify the selected target
        run: |
          $distribution = Join-Path $env:RUNNER_TEMP 'Oculum RL'
          ./tool/build_distribution.ps1 -Target "${{ matrix.target }}" -FlutterRoot $env:FLUTTER_ROOT `
            -Distribution $distribution -Stage (Join-Path $distribution 'candidate')
      - uses: actions/upload-artifact@v6
        if: matrix.target == 'Windows'
        with:
          name: Oculum-RL-Windows
          path: |
            ${{ runner.temp }}/Oculum RL/candidate/Windows/
            ${{ runner.temp }}/Oculum RL/candidate/Oculum-RL-Windows.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        if: matrix.target == 'Windows'
        with:
          name: Oculum-RL-Windows-Test
          path: |
            ${{ runner.temp }}/Oculum RL/candidate/Windows Test/
            ${{ runner.temp }}/Oculum RL/candidate/Oculum-RL-Windows-Test.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        if: matrix.target == 'Android'
        with:
          name: Oculum-RL-Android-debug
          path: ${{ runner.temp }}/Oculum RL/candidate/Oculum-RL-Android-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        if: matrix.target == 'Web'
        with:
          name: Oculum-RL-Web
          path: ${{ runner.temp }}/Oculum RL/candidate/Web/
          if-no-files-found: error
