name: Publish public downloads
on:
  workflow_run:
    workflows: [Build distribution]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful build run to publish
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: oculum-public-downloads
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts/tests -p test_publish_github_downloads.py
      - name: Mirror verified artifacts and update public download page
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
          GH_REPO: ${{ github.repository }}
        run: python scripts/publish_github_downloads.py "$SOURCE_RUN_ID"
