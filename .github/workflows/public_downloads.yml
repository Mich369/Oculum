name: Publish verified distribution and website
on:
  workflow_run:
    workflows: [Build distribution]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful build run to publish
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: oculum-public-downloads
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test publication and Pages validation
        run: |
          python -m unittest discover -s scripts/tests -p 'test_publish_github_downloads.py'
          python -m unittest discover -s scripts/tests -p 'test_prepare_github_pages.py'
      - name: Mirror verified artifacts and update public download page
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
          GH_REPO: ${{ github.repository }}
        run: python scripts/publish_github_downloads.py "$SOURCE_RUN_ID"

  deploy-pages:
    needs: publish
    if: needs.publish.result == 'success' && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: oculum-pages
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GH_REPO: ${{ github.repository }}
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
    steps:
      - name: Validate source build and avoid deploying an older success
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_json=$(gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN_ID")
          sha=$(jq -r '.head_sha' <<< "$run_json")
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]] || [[ $(jq -r '.head_branch' <<< "$run_json") != main ]] || [[ $(jq -r '.conclusion' <<< "$run_json") != success ]]; then
            echo "Source run is not a successful main-branch build."
            exit 1
          fi
          workflow_id=$(jq -r '.workflow_id' <<< "$run_json")
          workflow_path=$(gh api "repos/$GH_REPO/actions/workflows/$workflow_id" --jq '.path')
          if [[ "$workflow_path" != .github/workflows/build_distribution.yml ]]; then
            echo "Source run is not the trusted distribution workflow."
            exit 1
          fi
          latest_id=$(gh api "repos/$GH_REPO/actions/workflows/build_distribution.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].id')
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [[ "$latest_id" == "$SOURCE_RUN_ID" ]]; then
            echo "deploy_site=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy_site=false" >> "$GITHUB_OUTPUT"
            echo "A newer successful distribution exists; leaving its website deployment in place."
          fi
      - name: Check out the exact build source
        if: steps.source.outputs.deploy_site == 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false
      - name: Download the verified Web artifact
        if: steps.source.outputs.deploy_site == 'true'
        uses: actions/download-artifact@v6
        with:
          name: Oculum-Web
          path: build/pages-artifact
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
      - name: Verify and prepare the exact Pages bundle
        if: steps.source.outputs.deploy_site == 'true'
        run: |
          python3 scripts/prepare_github_pages.py \
            --archive build/pages-artifact/Oculum-Web.zip \
            --output build/pages-site \
            --commit '${{ steps.source.outputs.sha }}' \
            --base-path /Oculum/
      - name: Upload GitHub Pages payload
        if: steps.source.outputs.deploy_site == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/pages-site
      - name: Deploy the site from the successful distribution
        if: steps.source.outputs.deploy_site == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
