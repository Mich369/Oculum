name: oculum_rl
description: "Oculum RL, campagna roguelite 2D"
publish_to: none
version: 0.4.19+24

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  archive: 4.0.9
  audioplayers: 6.8.1
  crypto: 3.0.7
  path_provider: 2.1.6
  shared_preferences: 2.5.5
  supabase_flutter: 2.16.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  path_provider_platform_interface: 2.1.3

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/licenses/
    - assets/oculum/lite/
    - assets/oculum/lite/audio/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
    - family: Garamond
      fonts:
        - asset: assets/fonts/EBGaramond.ttf
