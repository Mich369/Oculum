name: oculum
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+3


environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2
  image_cropper: ^9.1.0
  image: ^4.8.0
  shared_preferences: ^2.5.5
  connectivity_plus: 6.1.5
  desktop_drop: ^0.6.0
  path_provider: ^2.1.5
  pdf: ^3.11.3
  supabase_flutter: ^2.12.4
  pointycastle: 4.0.0
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.0.0
  pasteboard: ^0.5.0
  url_launcher: ^6.3.2
  webview_flutter: ^4.13.1
  webview_windows: ^0.4.0
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
