  fonts:
    - family: Segoe UI
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Italic.ttf
          style: italic
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Italic.ttf
          style: italic
    - family: Copperplate Gothic Light
      fonts:
        - asset: assets/fonts/Cinzel.ttf
    - family: Garamond
      fonts:
        - asset: assets/fonts/EBGaramond.ttf
        - asset: assets/fonts/EBGaramond-Italic.ttf
          style: italic
    - family: Georgia
      fonts:
        - asset: assets/fonts/LibreBaskerville.ttf
        - asset: assets/fonts/LibreBaskerville-Italic.ttf
          style: italic
    - family: Palatino Linotype
      fonts:
        - asset: assets/fonts/CormorantGaramond.ttf
        - asset: assets/fonts/CormorantGaramond-Italic.ttf
          style: italic
    - family: Consolas
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
        - asset: assets/fonts/IBMPlexMono-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/oculum_eye.png"
  adaptive_icon_background: "#07080D"
  adaptive_icon_foreground: "assets/icon/oculum_eye.png"
