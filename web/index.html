<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#07080D">
  <meta name="description" content="Oculum: schede, campagne, realtime e tavolo virtuale per Master e giocatori.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Oculum">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Oculum</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; background: #07080d; color: #e9dcc2; }
    #oculum-loading { position: fixed; inset: 0; z-index: 9999; display: grid;
      place-content: center; text-align: center; gap: 18px;
      background: radial-gradient(ellipse, #21182e, #07080d 70%);
      font-family: Georgia, 'Palatino Linotype', serif; }
    #oculum-loading h1 { margin: 0; letter-spacing: .18em; color: #c8a56a; }
    #oculum-loading p { margin: 0; padding: 0 24px; }
    #oculum-loading button { margin: auto; padding: 10px 22px; color: #e9dcc2;
      background: #21182e; border: 1px solid #c8a56a; border-radius: 8px;
      font: inherit; cursor: pointer; }
  </style>
</head>
<body>
  <div id="oculum-loading" role="status" aria-live="polite">
    <h1>OCULUM</h1>
    <p id="oculum-loading-message">L'Occhio si apre…</p>
    <button id="oculum-retry" hidden onclick="location.reload()">Riprova</button>
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
